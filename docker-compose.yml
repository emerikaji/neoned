services:
  neoned:
    build: .
    restart: unless-stopped
    networks:
      - traefik_public
    environment:
      - API_KEY=${API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    volumes:
      - ./dev.db:/app/dev.db
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.neoned.rule=Host(`neoned.eaji.cc`)'
      - 'traefik.http.routers.neoned.entrypoints=websecure'
      - 'traefik.http.services.neoned.loadbalancer.server.port=3000'

networks:
  traefik_public:
    external: true